services:
  mysql:
    image: mysql:8.4
    container_name: afrimarket-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: fraud
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - afrimarket_mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  cassandra:
    image: cassandra:4.1
    container_name: afrimarket-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: AfriMarketCluster
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 100M
    volumes:
      - cassandra_data:/var/lib/cassandra
    mem_limit: 1500m
    ports:
      - "127.0.0.1:9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh 127.0.0.1 9042 -e 'DESCRIBE KEYSPACES' >/dev/null 2>&1"]
      interval: 30s
      timeout: 15s
      start_period: 120s
      retries: 10

  cassandra-init:
    image: cassandra:4.1
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init:/scripts:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "cqlsh cassandra 9042 -f /scripts/01_schema.cql"
    restart: "no"


volumes:
  afrimarket_mysql_data:
    name: afrimarket_mysql_data
  cassandra_data:
