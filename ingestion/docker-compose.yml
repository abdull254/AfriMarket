services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    hostname: kafka
    user: "0:0"
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - fraud-net

  hadoop:
    image: apache/hadoop:3.3.6
    container_name: hadoop
    restart: unless-stopped
    hostname: hadoop
    user: "0:0"
    ports:
      - "9871:9870"
    environment:
      HDFS_NAMENODE_USER: root
      HDFS_DATANODE_USER: root
      ENSURE_NAMENODE_DIR: /hadoop/dfs/name
      CORE-SITE.XML_fs.defaultFS: hdfs://hadoop:8020
      HDFS-SITE.XML_dfs.namenode.rpc-address: hadoop:8020
      HDFS-SITE.XML_dfs.namenode.name.dir: /hadoop/dfs/name
      HDFS-SITE.XML_dfs.datanode.data.dir: /hadoop/dfs/data
      HDFS-SITE.XML_dfs.replication: "1"
      HDFS-SITE.XML_dfs.permissions.enabled: "false"
      HDFS-SITE.XML_dfs.webhdfs.enabled: "true"
    command: ["bash", "-c", "hdfs --daemon start datanode && hdfs namenode"]
    volumes:
      - hdfs-data:/hadoop/dfs
      - ./data:/shared:ro
    networks:
      - fraud-net

  python:
    build: ./python
    container_name: python
    restart: unless-stopped
    depends_on:
      - kafka
      - hadoop
    command: ["sleep", "infinity"]
    working_dir: /scripts
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      HDFS_URL: http://hadoop:9870
      DATA_DIR: /data
    volumes:
      - ./data:/data
      - ./scripts:/scripts
    networks:
      - fraud-net

networks:
  fraud-net:
    driver: bridge

volumes:
  kafka-data:
  hdfs-data:
